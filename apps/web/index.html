    <script>
      // Laptops: first-screen headings stay hidden until their entrance
      // animation takes over (see .motion-boot in editorial.css), so ready-made
      // pages do not show them, hide them and animate them in again. Phones
      // show them straight away and skip that animation (entranceOK in motion.ts).
      if (matchMedia('(min-width: 768px) and (prefers-reduced-motion: no-preference)').matches) {
        document.documentElement.classList.add('motion-boot');
        setTimeout(function () { document.documentElement.classList.remove('motion-boot'); }, 4000);
      }
    </script>

    />
