# Certificate must cover yuktids.com AND www.yuktids.com before enabling HTTPS.
server {
    listen 80;
    server_name yuktids.com www.yuktids.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://yuktids.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.yuktids.com;
    ssl_certificate /etc/letsencrypt/live/yuktids.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuktids.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://yuktids.com$request_uri;
}
server {
    listen 443 ssl;
    server_name yuktids.com;
    ssl_certificate /etc/letsencrypt/live/yuktids.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuktids.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/yukti/static;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ ^/(admin|api|uploads)(/|$) { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    # Explicit published routes prevent unknown URLs becoming soft 404s.
    # Keep this list in sync when adding a page or service.
    location ~ ^/(about|services|blog|contact|free-growth-audit|privacy|terms|work|case-studies)$ {
        try_files $uri /index.html;
    }
    location ~ ^/services/(social-media-marketing|video-production-tvc-ads|meta-ads-services|seo)$ {
        try_files $uri /index.html;
    }
    location ~ ^/blog/(get-found-on-google-maps|boost-post-vs-meta-ads-campaign|plan-a-month-of-social-media-content)$ {
        try_files $uri /index.html;
    }
    # The blog used to be called Insights.
    location ~ ^/insights(/.*)?$ { return 301 /blog$1; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
